<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- background: soft charcoal-to-black gradient, like the lire / Still icons -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b40"/>
      <stop offset="0.55" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- the book: white at the top easing to light grey -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c9cf"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g filter="url(#lift)">
    <!-- page block under the open pages -->
    <path d="M150 330 L150 750 C290 716 420 724 512 792 C604 724 734 716 874 750 L874 330"
          fill="none" stroke="url(#ink)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- left and right pages -->
    <path d="M500 312 C420 262 300 252 196 282 L196 712 C300 684 420 692 500 746 Z" fill="url(#ink)"/>
    <path d="M524 312 C604 262 724 252 828 282 L828 712 C724 684 604 692 524 746 Z" fill="url(#ink)"/>
  </g>
  <!-- lines of text, in the background's dark tone -->
  <g fill="none" stroke="#26262a" stroke-width="16" stroke-linecap="round">
    <path d="M256 370 C320 356 390 360 446 384"/>
    <path d="M256 448 C320 434 390 438 446 462"/>
    <path d="M256 526 C320 512 390 516 446 540"/>
    <path d="M256 604 C310 592 360 594 400 610"/>
    <path d="M768 370 C704 356 634 360 578 384"/>
    <path d="M768 448 C704 434 634 438 578 462"/>
    <path d="M768 526 C704 512 634 516 578 540"/>
    <path d="M768 604 C714 592 664 594 624 610"/>
  </g>
</svg>
