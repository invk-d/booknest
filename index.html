<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BookNest</title>
  <meta name="description" content="An eReader with folders for your EPUB, PDF and text books.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BookNest">
  <!-- Not translucent: iOS then colours the status bar area with theme-color, which BookNest
       keeps in step with the theme on screen (library appearance or the book's page colour). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="icons/icon-192.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the library appearance and status bar colour before the first paint.
    (function () {
      var a = 'system';
      try { a = JSON.parse(localStorage.getItem('booknest.appearance') || '"system"'); } catch (e) {}
      if (a !== 'system') document.documentElement.dataset.theme = a;
      try {
        var acc = JSON.parse(localStorage.getItem('booknest.accent') || '"blue"');
        if (acc !== 'blue') document.documentElement.dataset.accent = acc;
        var z = JSON.parse(localStorage.getItem('booknest.uiScale') || '1');
        if (z !== 1) document.documentElement.style.setProperty('--ui-zoom', z);
      } catch (e) {}
      var dark = a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#000000' : '#ffffff');
    })();
  </script>
  <script src="vendor/jszip.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app"><div class="empty">Loading…</div></div>
  <div id="reader" class="reader" hidden></div>
  <input id="fileInput" type="file" multiple hidden>
  <input id="restoreInput" type="file" hidden>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <input id="zipInput" type="file" hidden>
  <noscript><p class="empty">BookNest needs JavaScript to run.</p></noscript>
</body>
</html>
